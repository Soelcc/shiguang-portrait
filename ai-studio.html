<!DOCTYPE html>
<!-- 时光肖像馆 ©2025 Soelc -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 影像工作室 - 时光肖像馆</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232c1810%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%23c5a572%22 font-family=%22serif%22>%E6%97%B6</text></svg>">
    <style>
        :root {
            --bg: #faf7f2;
            --gold: #c5a572;
            --gold-dark: #8b6914;
            --brown: #5a3a2a;
            --brown-dark: #2c1810;
            --white: #fff;
            --text: #2c2c2c;
            --gray: #999;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .topbar {
            background: var(--brown-dark);
            color: #fff;
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar a {
            color: var(--gold);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .topbar h3 {
            font-family: 'Noto Serif SC', serif;
            font-weight: 400;
            letter-spacing: 0.1em;
            font-size: 1.1rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem;
        }
        .title {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .title h1 {
            font-family: 'Noto Serif SC', serif;
            font-size: 2rem;
            color: var(--brown);
            margin-bottom: 0.5rem;
        }
        .title p {
            color: var(--gray);
            font-size: 0.95rem;
        }

        /* Main layout */
        .studio-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 768px) {
            .studio-layout { grid-template-columns: 1fr; }
            .container { padding: 1rem; }
        }

        /* Upload zone */
        .upload-zone {
            border: 2px dashed #d4b896;
            border-radius: 16px;
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--white);
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .upload-zone:hover, .upload-zone.drag-over {
            border-color: var(--gold-dark);
            background: rgba(197,165,114,0.05);
        }
        .upload-zone.has-image {
            padding: 0;
            border-style: solid;
            overflow: hidden;
        }
        .upload-zone img {
            width: 100%;
            height: 300px;
            object-fit: contain;
            display: block;
            border-radius: 14px;
        }
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 0.8rem;
        }
        .upload-text {
            font-size: 0.95rem;
            color: var(--brown);
            margin-bottom: 0.3rem;
        }
        .upload-hint {
            font-size: 0.78rem;
            color: var(--gray);
        }
        .upload-reset {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
        }
        #fileInput { display: none; }

        /* Style cards */
        .styles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
        }
        @media (max-width: 500px) {
            .styles-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .style-card {
            background: var(--white);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 0.8rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .style-card:hover {
            border-color: #d4b896;
            transform: translateY(-2px);
        }
        .style-card.active {
            border-color: var(--gold-dark);
            background: rgba(197,165,114,0.08);
        }
        .style-card .style-icon {
            font-size: 2rem;
            margin-bottom: 0.4rem;
        }
        .style-card .style-name {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--brown);
        }
        .style-card .style-desc {
            font-size: 0.7rem;
            color: var(--gray);
            margin-top: 0.2rem;
        }

        /* Custom prompt */
        .prompt-section {
            margin-top: 1rem;
        }
        .prompt-section label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--brown);
            margin-bottom: 0.4rem;
        }
        .prompt-section textarea {
            width: 100%;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 10px;
            padding: 0.8rem;
            font-size: 0.85rem;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            background: var(--white);
            transition: border-color 0.2s;
        }
        .prompt-section textarea:focus {
            outline: none;
            border-color: var(--gold);
        }

        /* Generate button */
        .btn-generate {
            display: block;
            width: 100%;
            margin-top: 1rem;
            padding: 0.9rem;
            background: var(--brown-dark);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .btn-generate:hover {
            background: var(--gold-dark);
            transform: translateY(-1px);
        }
        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Result */
        .result-section {
            margin-top: 2rem;
        }
        .result-section h3 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.2rem;
            color: var(--brown);
            margin-bottom: 1rem;
        }
        .result-preview {
            background: var(--white);
            border-radius: 16px;
            padding: 1.5rem;
            text-align: center;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.06);
        }
        .result-preview img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #eee;
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-msg {
            color: #dc3545;
            font-size: 0.9rem;
            display: none;
        }
        .btn-download {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1.2rem;
            background: var(--gold);
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .btn-download:hover {
            background: var(--gold-dark);
        }
    </style>
</head>
<body>

<div class="topbar">
    <h3>✨ AI 影像工作室</h3>
    <a href="index.html">← 返回首页</a>
</div>

<div class="container">
    <div class="title">
        <h1>AI 影像工作室</h1>
        <p>上传照片或输入描述，AI 为你生成专属艺术肖像</p>
    </div>

    <div class="studio-layout">
        <!-- Left: Upload + Styles -->
        <div>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📷</div>
                <div class="upload-text">点击或拖拽上传照片</div>
                <div class="upload-hint">支持 JPG、PNG，最大 10MB</div>
                <button class="upload-reset" id="resetBtn" style="display:none" onclick="event.stopPropagation();resetImage()">✕</button>
            </div>
            <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">

            <h3 style="margin:1.2rem 0 0.6rem;font-family:'Noto Serif SC',serif;color:var(--brown);font-size:1rem;">选择风格</h3>
            <div class="styles-grid" id="stylesGrid"></div>

            <div class="prompt-section">
                <label for="customPrompt">自定义描述（可选）</label>
                <textarea id="customPrompt" placeholder="例如：穿着白色连衣裙，在樱花树下..."></textarea>
            </div>
            <button class="btn-generate" id="generateBtn" onclick="generateImage()">🚀 开始生成</button>
        </div>

        <!-- Right: Result -->
        <div class="result-section" id="resultSection" style="display:none">
            <h3>生成结果</h3>
            <div class="result-preview" id="resultContent">
                <div class="loading-spinner" id="loadingSpinner"></div>
            </div>
            <p class="error-msg" id="errorMsg"></p>
        </div>
    </div>
</div>

<script>
/* ==============================
   AI 工作室 - 风格数据 & 上传逻辑
   ============================== */
var styles = [
    { id: 'guofeng',  name: '国风雅韵', icon: '🏮', desc: '古典水墨意境的东方美学',  prompt: 'traditional Chinese ink wash painting style portrait, elegant, flowing silk fabrics, misty atmosphere, classical beauty, soft natural lighting, artistic' },
    { id: 'youhua',  name: '油画质感', icon: '🎨', desc: '如古典油画般的细腻笔触',  prompt: 'classical oil painting portrait style, Renaissance aesthetic, rich warm colors, dramatic chiaroscuro lighting, textured brushstrokes, fine art photography' },
    { id: 'senlin',  name: '森林精灵', icon: '🌿', desc: '仙气缭绕的神秘森系风格',  prompt: 'ethereal forest fairy portrait, magical woodland atmosphere, soft diffused light through trees, flowers in hair, whimsical fantasy, dreamy bokeh background, fairycore aesthetic' },
    { id: 'fugu',    name: '复古胶片', icon: '📸', desc: '经典胶片色调的怀旧质感',  prompt: 'vintage film camera portrait, analog photography, warm grain, light leaks, 80s nostalgic mood, soft focus, Kodak Portra film style, retro aesthetic' },
    { id: 'heibai',  name: '黑白经典', icon: '🖤', desc: '纯粹光影的高级黑白影像',  prompt: 'black and white fine art portrait, dramatic shadows, high contrast, timeless elegance, Henri Cartier-Bresson style, emotional depth, minimalist composition' },
    { id: 'dongman', name: '动漫次元', icon: '🎭', desc: '二次元动漫风格的趣味变身',  prompt: 'anime style portrait, Studio Ghibli aesthetic, vibrant colors, clean lines, Japanese animation art style, charming character design, soft cel shading' }
];

var selectedStyle = 'guofeng';
var uploadedImageData = null;

/* 渲染风格卡片 */
function renderStyles() {
    var grid = document.getElementById('stylesGrid');
    grid.innerHTML = styles.map(function(s) {
        var isActive = s.id === selectedStyle;
        return '<div class="style-card' + (isActive ? ' active' : '') + '" onclick="selectStyle(\'' + s.id + '\')" data-id="' + s.id + '">' +
            '<div class="style-icon">' + s.icon + '</div>' +
            '<div class="style-name">' + s.name + '</div>' +
            '<div class="style-desc">' + s.desc + '</div>' +
        '</div>';
    }).join('');
}
renderStyles();

function selectStyle(styleId) {
    selectedStyle = styleId;
    document.querySelectorAll('.style-card').forEach(function(card) {
        card.classList.toggle('active', card.dataset.id === styleId);
    });
}

/* 图片上传 */
function handleFileSelect(event) {
    var file = event.target.files[0];
    if (!file) return;
    if (file.size > 10 * 1024 * 1024) { alert('文件不能超过 10MB'); return; }

    var reader = new FileReader();
    reader.onload = function(e) {
        uploadedImageData = e.target.result;
        var zone = document.getElementById('uploadZone');
        zone.classList.add('has-image');
        zone.innerHTML = '<img src="' + uploadedImageData + '" alt="uploaded photo"><button class="upload-reset" onclick="event.stopPropagation();resetImage()">✕</button>';
    };
    reader.readAsDataURL(file);
}

/* 拖拽上传 */
var uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', function(e) { this.classList.remove('drag-over'); });
uploadZone.addEventListener('drop', function(e) {
    e.preventDefault();
    this.classList.remove('drag-over');
    var file = e.dataTransfer.files[0];
    if (file) {
        var dt = new DataTransfer();
        dt.items.add(file);
        document.getElementById('fileInput').files = dt.files;
        handleFileSelect({ target: { files: dt.files } });
    }
});

function resetImage() {
    uploadedImageData = null;
    document.getElementById('fileInput').value = '';
    var zone = document.getElementById('uploadZone');
    zone.classList.remove('has-image');
    zone.innerHTML = '<div class="upload-icon">📷</div><div class="upload-text">点击或拖拽上传照片</div><div class="upload-hint">支持 JPG、PNG，最大 10MB</div><button class="upload-reset" id="resetBtn" style="display:none" onclick="event.stopPropagation();resetImage()">✕</button>';
}
</script>

<script src="js/main.js"></script>
<script>
/* ==============================
   AI 生成 - 集成日志记录
   ============================== */
var generateBtn = document.getElementById('generateBtn');

generateBtn.onclick = async function() {
    var style = styles.find(function(s) { return s.id === selectedStyle; });
    var custom = document.getElementById('customPrompt').value.trim();
    var prompt = style.prompt;
    if (custom) prompt = custom + ', ' + prompt;

    var resultSection = document.getElementById('resultSection');
    var spinner = document.getElementById('loadingSpinner');
    var resultContent = document.getElementById('resultContent');
    var errorMsg = document.getElementById('errorMsg');

    resultSection.style.display = 'block';
    spinner.style.display = 'block';
    resultContent.innerHTML = '';
    errorMsg.style.display = 'none';
    this.disabled = true;
    this.textContent = '⏳ 生成中...';

    try {
        var encodedPrompt = encodeURIComponent(prompt);
        var imgUrl = 'https://image.pollinations.ai/prompt/' + encodedPrompt + '?width=512&height=512&nologo=true&seed=' + Math.floor(Math.random() * 99999);

        var img = new Image();
        img.onload = function() {
            spinner.style.display = 'none';
            resultContent.innerHTML = '<img src="' + imgUrl + '" alt="AI Generated"><br><a href="' + imgUrl + '" download="ai-portrait.jpg" class="btn-download" target="_blank">📥 下载图片</a>';
            generateBtn.disabled = false;
            generateBtn.textContent = '🚀 重新生成';

            // 保存生成日志
            var session = JSON.parse(localStorage.getItem('sg_session') || 'null');
            if (typeof SG_saveAILog === 'function') {
                SG_saveAILog({
                    userId: session ? session.id : null,
                    username: session ? session.name : '游客',
                    style: style.name,
                    prompt: prompt,
                    imageUrl: imgUrl
                });
            }
        };
        img.onerror = function() {
            spinner.style.display = 'none';
            errorMsg.style.display = 'block';
            errorMsg.textContent = '生成失败，请稍后重试';
            generateBtn.disabled = false;
            generateBtn.textContent = '🚀 开始生成';
        };
        img.src = imgUrl;
    } catch (e) {
        spinner.style.display = 'none';
        errorMsg.style.display = 'block';
        errorMsg.textContent = '网络错误：' + e.message;
        generateBtn.disabled = false;
        generateBtn.textContent = '🚀 开始生成';
    }
};
</script>

</body>
</html>
