<!DOCTYPE html>
<!-- 时光肖像馆 ©2025 Soelc -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%232c1810%22/><text x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22%23c5a572%22 font-family=%22serif%22>%E6%97%B6</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 时光肖像馆</title>
    <link rel="stylesheet" href="css/style.css?v=16">
    <style>
        :root{--bg:#f5f0e8;--sidebar:#2c1810;--gold:#c5a572;--gold-dark:#8b6914;--brown:#5a3a2a}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:#2c2c2c}
        .admin-layout{display:flex;min-height:100vh}
        .admin-sidebar{width:220px;background:var(--sidebar);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
        .admin-sidebar .sb-brand{padding:1.5rem 1.2rem;text-align:center;border-bottom:1px solid rgba(255,255,255,0.08)}
        .admin-sidebar .sb-brand h2{font-family:'Noto Serif SC',serif;font-size:1.2rem;font-weight:400;letter-spacing:0.1em;color:var(--gold)}
        .admin-sidebar .sb-brand small{display:block;font-size:0.65rem;color:rgba(255,255,255,0.4);margin-top:0.2rem;letter-spacing:0.2em}
        .admin-sidebar .sb-nav{flex:1;padding:0.8rem 0}
        .sb-tab{display:flex;align-items:center;gap:0.6rem;width:100%;padding:0.75rem 1.2rem;background:none;border:none;color:rgba(255,255,255,0.6);font-size:0.88rem;cursor:pointer;transition:all 0.2s;text-align:left;font-family:inherit}
        .sb-tab:hover{background:rgba(255,255,255,0.05);color:#fff}
        .sb-tab.active{background:rgba(197,165,114,0.15);color:var(--gold);border-right:3px solid var(--gold)}
        .sb-tab .tab-icon{font-size:1.1rem;width:22px;text-align:center}
        .admin-sidebar .sb-footer{padding:1rem 1.2rem;border-top:1px solid rgba(255,255,255,0.08)}
        .admin-sidebar .sb-footer a,.admin-sidebar .sb-footer button{display:block;width:100%;padding:0.5rem;background:none;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);text-align:center;cursor:pointer;font-size:0.82rem;border-radius:6px;text-decoration:none;font-family:inherit;margin-bottom:0.4rem;transition:all 0.2s}
        .admin-sidebar .sb-footer a:hover,.admin-sidebar .sb-footer button:hover{background:rgba(255,255,255,0.08);color:#fff}
        .admin-main{flex:1;padding:1.5rem 2rem;overflow-y:auto}
        .admin-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid rgba(0,0,0,0.06)}
        .admin-topbar h3{font-family:'Noto Serif SC',serif;font-size:1.3rem;font-weight:500;color:var(--brown)}
        .admin-topbar .topbar-right{display:flex;align-items:center;gap:0.8rem;font-size:0.85rem;color:#888}
        .admin-panel{display:none;animation:fadeIn 0.25s ease}
        .admin-panel.active{display:block}
        @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .admin-empty{text-align:center;padding:3rem 1rem;color:#999}
        .admin-empty p{font-size:1.1rem;margin-bottom:1rem}

        /* Stats */
        .stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-bottom:1.5rem}
        .stat-box{background:#fff;border-radius:12px;padding:1.3rem;text-align:center;border:1px solid rgba(0,0,0,0.04)}
        .stat-box .stat-num{font-size:2rem;font-weight:700;color:var(--gold-dark);font-family:'Noto Serif SC',serif}
        .stat-box .stat-lbl{font-size:0.82rem;color:#999;margin-top:0.2rem}

        /* Table */
        .tbl-wrap{overflow-x:auto;background:#fff;border-radius:12px;border:1px solid rgba(0,0,0,0.04)}
        .tbl{width:100%;border-collapse:collapse;font-size:0.85rem}
        .tbl th{background:rgba(0,0,0,0.015);padding:0.7rem 0.8rem;text-align:left;font-weight:600;color:var(--brown);border-bottom:1px solid rgba(0,0,0,0.06);white-space:nowrap}
        .tbl td{padding:0.7rem 0.8rem;border-bottom:1px solid rgba(0,0,0,0.03);color:#555}
        .tbl tr:hover td{background:rgba(197,165,114,0.02)}
        .tbl .btn-xs{padding:0.25rem 0.6rem;font-size:0.73rem;border-radius:5px;margin:0 2px;cursor:pointer;border:none;font-weight:500;transition:all 0.15s}
        .btn-ok{background:#d4edda;color:#155724}.btn-ok:hover{background:#28a745;color:#fff}
        .btn-no{background:#f8d7da;color:#721c24}.btn-no:hover{background:#dc3545;color:#fff}
        .btn-fin{background:#cce5ff;color:#004085}.btn-fin:hover{background:#007bff;color:#fff}
        .badge{padding:0.2rem 0.6rem;border-radius:12px;font-size:0.75rem;font-weight:600;white-space:nowrap}

        /* Responsive */
        @media(max-width:1024px){.stats-row{grid-template-columns:repeat(3,1fr)}}
        @media(max-width:768px){
            .admin-sidebar{width:60px;overflow:hidden}
            .admin-sidebar .sb-brand h2{font-size:0.9rem}
            .admin-sidebar .sb-brand small,.sb-tab{font-size:0;justify-content:center}
            .sb-tab .tab-icon{font-size:1.3rem;margin:0}
            .admin-main{padding:1rem}
            .stats-row{grid-template-columns:repeat(2,1fr)}
        }
    </style>
</head>
<body>
<div class="admin-layout">
    <!-- Sidebar -->
    <div class="admin-sidebar">
        <div class="sb-brand">
            <h2>时光肖像馆</h2>
            <small>管理后台</small>
        </div>
        <div class="sb-nav" id="sidebarNav"></div>
        <div class="sb-footer">
            <a href="index.html">← 返回首页</a>
            <button onclick="SG_logout()">退出登录</button>
        </div>
    </div>
    <!-- Main -->
    <div class="admin-main">
        <div class="admin-topbar">
            <h3 id="pageTitle">管理后台</h3>
            <div class="topbar-right">
                <span id="userGreeting">👤 用户</span>
            </div>
        </div>

        <!-- My Bookings Panel -->
        <div class="admin-panel" id="panel-myBookings">
            <div class="tbl-wrap">
                <div id="myBookingsList"></div>
            </div>
        </div>

        <!-- My Profile Panel -->
        <div class="admin-panel" id="panel-myProfile">
            <div id="myProfileContent"></div>
        </div>

        <!-- My VIP Panel -->
        <div class="admin-panel" id="panel-myVip">
            <div id="myVipContent"></div>
        </div>

        <!-- Admin: All Bookings -->
        <div class="admin-panel" id="panel-allBookings">
            <div class="dash-toolbar">
                <select id="bookingFilter">
                    <option value="all">全部</option>
                    <option value="pending">待处理</option>
                    <option value="approved">已确认</option>
                    <option value="rejected">已拒绝</option>
                    <option value="completed">已完成</option>
                </select>
                <span class="booking-count" id="bookingCount">共 0 条</span>
            </div>
            <div class="tbl-wrap">
                <table class="tbl">
                    <thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>电话</th><th>类型</th><th>日期</th><th>状态</th><th>操作</th></tr></thead>
                    <tbody id="bookingsTableBody"><tr><td colspan="8" style="text-align:center;color:#999">暂无数据</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- Admin: User Management -->
        <div class="admin-panel" id="panel-userManagement">
            <div class="tbl-wrap">
                <table class="tbl">
                    <thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>手机号</th><th>角色</th><th>VIP</th><th>操作</th></tr></thead>
                    <tbody id="usersTableBody"><tr><td colspan="7" style="text-align:center;color:#999">暂无数据</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- Admin: VIP Applications -->
        <div class="admin-panel" id="panel-vipApps">
            <div class="tbl-wrap">
                <table class="tbl">
                    <thead><tr><th>ID</th><th>用户名</th><th>方案</th><th>金额</th><th>申请时间</th><th>操作</th></tr></thead>
                    <tbody id="vipAppsTableBody"><tr><td colspan="6" style="text-align:center;color:#999">暂无待审核申请</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- Admin: VIP Management -->
        <div class="admin-panel" id="panel-vipManagement">
            <div class="tbl-wrap">
                <table class="tbl">
                    <thead><tr><th>ID</th><th>用户名</th><th>姓名</th><th>手机号</th><th>操作</th></tr></thead>
                    <tbody id="vipMgmtTableBody"><tr><td colspan="5" style="text-align:center;color:#999">暂无 VIP 会员</td></tr></tbody>
                </table>
            </div>
        </div>

        <!-- Admin: AI Logs -->
        <div class="admin-panel" id="panel-aiLogs">
            <div id="aiLogsList"></div>
            <div class="admin-empty" id="aiLogsEmpty" style="display:none"><p>🤖 暂无AI生成记录</p></div>
        </div>

        <!-- Admin: Stats -->
        <div class="admin-panel" id="panel-stats">
            <div class="stats-row">
                <div class="stat-box"><div class="stat-num" id="statTodayPV">0</div><div class="stat-lbl">📈 今日访问</div></div>
                <div class="stat-box"><div class="stat-num" id="statTotalPV">0</div><div class="stat-lbl">📊 总访问量</div></div>
                <div class="stat-box"><div class="stat-num" id="statTodayUV">0</div><div class="stat-lbl">👤 今日访客</div></div>
                <div class="stat-box"><div class="stat-num" id="statTotalUV">0</div><div class="stat-lbl">🌐 总访客数</div></div>
                <div class="stat-box"><div class="stat-num" id="statTotalUsers">0</div><div class="stat-lbl">👥 注册用户</div></div>
            </div>
            <div class="stats-row">
                <div class="stat-box"><div class="stat-num" id="statTotalBookings">0</div><div class="stat-lbl">📋 总预约</div></div>
                <div class="stat-box"><div class="stat-num" id="statPendingBookings">0</div><div class="stat-lbl">⏳ 待处理预约</div></div>
                <div class="stat-box"><div class="stat-num" id="statTodayBookings">0</div><div class="stat-lbl">📅 今日预约</div></div>
                <div class="stat-box"><div class="stat-num" id="statTotalVip">0</div><div class="stat-lbl">👑 VIP会员</div></div>
                <div class="stat-box"><div class="stat-num" id="statPendingVipApps">0</div><div class="stat-lbl">💳 待审VIP</div></div>
            </div>
            <h4 style="margin:1.5rem 0 0.8rem;font-family:'Noto Serif SC',serif;color:var(--brown)">📋 最近访问记录</h4>
            <div class="tbl-wrap">
                <table class="tbl" id="pvTable">
                    <thead><tr><th>页面</th><th>访问时间</th><th>会话ID</th></tr></thead>
                    <tbody><tr><td colspan="3" style="text-align:center;color:#999">暂无数据</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="js/main.js?v=16"></script>
<script>
(function(){
  var s = JSON.parse(localStorage.getItem('sg_session')||'null');
  if(!s){ location.href='index.html'; return; }

  var isAdmin = s.role==='admin';

  document.getElementById('userGreeting').textContent = '👤 '+s.name+' ('+(isAdmin?'管理员':'用户')+')';
  document.getElementById('pageTitle').textContent = isAdmin ? '管理后台' : '我的后台';

  // Sidebar tabs
  var userTabs = [
    {id:'myBookings',icon:'📋',label:'我的预约'},
    {id:'myProfile',icon:'👤',label:'个人信息'},
    {id:'myVip',icon:'👑',label:'VIP会员'}
  ];
  var adminTabs = [
    {id:'allBookings',icon:'📋',label:'预约管理'},
    {id:'userManagement',icon:'👥',label:'用户管理'},
    {id:'vipApps',icon:'💳',label:'VIP审核'},{id:'vipManagement',icon:'👑',label:'VIP管理'},
    {id:'stats',icon:'📊',label:'网站统计'},{id:'aiLogs',icon:'🤖',label:'AI生成记录'}
  ];
  var tabs = isAdmin ? adminTabs : userTabs;
  var nav = document.getElementById('sidebarNav');
  tabs.forEach(function(t,i){
    var btn = document.createElement('button');
    btn.className = 'sb-tab'+(i===0?' active':'');
    btn.innerHTML = '<span class="tab-icon">'+t.icon+'</span>'+t.label;
    btn.dataset.panel = t.id; btn.onclick = function(){ switchPanel(this.dataset.panel); };
    nav.appendChild(btn);
  });

  function switchPanel(id){
    localStorage.setItem('sg_admin_tab',id);
    document.querySelectorAll('.sb-tab').forEach(function(b){b.classList.remove('active')});
    var ab=document.querySelector('.sb-tab[data-panel='+JSON.stringify(id)+']');
    if(ab)ab.classList.add('active');
    document.querySelectorAll('.admin-panel').forEach(function(p){p.classList.remove('active')});
    var panel = document.getElementById('panel-'+id);
    if(panel) panel.classList.add('active');

    // Trigger render
    var renderMap = {
      myBookings: SG_renderMyBookings, myProfile: SG_renderMyProfile, myVip: SG_renderMyVip,
      allBookings: SG_renderAdminBookings, userManagement: SG_renderUsers,
      vipApps: SG_renderVipApps, vipManagement: SG_renderVipMgmt,
      stats: SG_renderStats, aiLogs: SG_renderAiLogs
    };
    if (renderMap[id]) renderMap[id]();
  }

  // Init first panel
  var savedTab = localStorage.getItem('sg_admin_tab');
  var firstTab = savedTab && tabs.find(function(t){return t.id===savedTab}) ? savedTab : tabs[0].id;
  switchPanel(firstTab);
})();
</script>

</body>
</html>
